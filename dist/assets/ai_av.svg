<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf6fb"/>
      <stop offset="1" stop-color="#caf0f8"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd8f0"/>
      <stop offset="1" stop-color="#48cae4"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg)"/>
  <!-- 天线 -->
  <line x1="100" y1="44" x2="100" y2="26" stroke="#0a3d62" stroke-width="5" stroke-linecap="round"/>
  <circle cx="100" cy="22" r="9" fill="#ffd166" stroke="#0a3d62" stroke-width="3"/>
  <!-- 头部 -->
  <rect x="46" y="44" width="108" height="96" rx="26" fill="url(#face)" stroke="#0a3d62" stroke-width="5"/>
  <!-- 额头 AI 标识 -->
  <text x="100" y="72" text-anchor="middle" font-size="20" font-weight="800" fill="#0a3d62" font-family="Arial, sans-serif">AI</text>
  <!-- 眼睛 -->
  <circle cx="78" cy="96" r="11" fill="#ffffff" stroke="#0a3d62" stroke-width="4"/>
  <circle cx="122" cy="96" r="11" fill="#ffffff" stroke="#0a3d62" stroke-width="4"/>
  <circle cx="80" cy="94" r="4" fill="#0a3d62"/>
  <circle cx="124" cy="94" r="4" fill="#0a3d62"/>
  <!-- 嘴：微笑 -->
  <path d="M78 116 Q100 134 122 116" fill="none" stroke="#0a3d62" stroke-width="4" stroke-linecap="round"/>
  <!-- 身体/底座 -->
  <rect x="70" y="146" width="60" height="30" rx="14" fill="#1b6ca8" stroke="#0a3d62" stroke-width="4"/>
  <circle cx="100" cy="161" r="5" fill="#caf0f8"/>
</svg>
