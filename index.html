<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="旺仔台" />
<meta name="theme-color" content="#0a3d62" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="assets/luffy.png" />
<title>旺仔的工作台</title>
<style>
  :root{
    --ocean-deep:#0a3d62;
    --ocean:#1b6ca8;
    --ocean-light:#48cae4;
    --sky:#90e0ef;
    --foam:#caf0f8;
    --bg1:#e6f2fb;
    --bg2:#cfe8f7;
    --card:#f4fafe;
    --app-bg:#e9f3fb;
    --card-bg:#f4fafe;
    --ink:#0a3d62;
    --ink-soft:#3d6b8a;
    --gold:#f6c453;
    --shadow:0 8px 24px rgba(10,61,98,.12);
    --shadow-sm:0 3px 10px rgba(10,61,98,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    color:var(--ink);
    display:flex;
    min-height:100vh;
    overflow:hidden;
  }
  /* ===== Sidebar ===== */
  .sidebar{
    width:200px;
    flex:0 0 200px;
    background:linear-gradient(180deg,var(--ocean-deep),var(--ocean));
    color:#fff;
    display:flex;
    flex-direction:column;
    padding:18px 10px 14px;
    overflow-y:auto;
    box-shadow:4px 0 18px rgba(10,61,98,.25);
  }
  .brand{
    display:flex;align-items:center;gap:9px;
    padding:6px 8px 14px;
    border-bottom:1px solid rgba(255,255,255,.18);
    margin-bottom:10px;
  }
  .brand .logo{width:34px;height:34px;flex:0 0 34px;}
  .brand .title{font-size:15px;font-weight:700;line-height:1.25;letter-spacing:.5px;}
  .brand .title small{display:block;font-size:10px;font-weight:400;opacity:.75;letter-spacing:1px;}
  .nav{display:flex;flex-direction:column;gap:4px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 10px;
    border-radius:12px;
    cursor:pointer;
    transition:.18s;
    color:rgba(255,255,255,.88);
    font-size:13.5px;
    user-select:none;
  }
  .nav-item .av{width:30px;height:30px;flex:0 0 30px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,.12);}
  .nav-item .av svg{display:block;width:100%;height:100%;}
  .nav-item .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:transparent;transition:.18s;}
  .nav-item:hover{background:rgba(255,255,255,.12);}
  .nav-item.active{background:rgba(255,255,255,.18);color:#fff;box-shadow:inset 3px 0 0 var(--gold);}
  .nav-item.active .dot{background:var(--gold);box-shadow:0 0 8px var(--gold);}
  .sidebar-foot{margin-top:auto;padding:10px 8px 2px;font-size:10.5px;opacity:.6;line-height:1.5;border-top:1px solid rgba(255,255,255,.15);}

  /* 拖拽排序 */
  .nav-item.dragging{opacity:.4;}
  .nav-item.drag-over{box-shadow:inset 0 3px 0 var(--gold);}
  body.sorting .nav-item{animation:navWiggle .45s infinite;}
  body.sorting .nav-item.dragging{animation:none;opacity:.5;}
  @keyframes navWiggle{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
  .drag-h{display:none;color:rgba(255,255,255,.45);font-size:16px;margin-left:-4px;cursor:grab;}
  .char-av-svg{display:block;width:100%;height:100%;}
  .char-av-svg svg{width:100%;height:100%;display:block;}

  /* 总览模块 */
  .ov-list{display:flex;flex-direction:column;gap:12px;margin-top:8px;}
  .ov-card{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow-sm);cursor:pointer;transition:.18s;border:2px solid transparent;}
  .ov-card:hover{border-color:var(--ocean-light);transform:translateY(-2px);box-shadow:var(--shadow);}
  .ov-card .av{width:44px;height:44px;flex:0 0 44px;border-radius:50%;overflow:hidden;background:rgba(10,61,98,.08);}
  .ov-info{flex:1;min-width:0;}
  .ov-nm{font-size:14.5px;font-weight:800;color:var(--ocean-deep);}
  .ov-tt{font-size:13px;color:#22455e;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ov-sum{font-size:11.5px;color:var(--ink-soft);margin-top:2px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .ov-card .mini-check{flex:0 0 auto;}

  /* ===== Main ===== */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .topbar{
    display:flex;align-items:center;gap:18px;
    padding:16px 26px;
    background:rgba(255,255,255,.7);
    backdrop-filter:blur(6px);
    border-bottom:1px solid rgba(10,61,98,.08);
    box-shadow:var(--shadow-sm);
    z-index:5;
  }
  .clock-wrap{display:flex;flex-direction:column;line-height:1.1;}
  .clock{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ocean-deep);letter-spacing:1px;}
  .clock .sec{font-size:18px;color:var(--ocean);}
  .date{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .quote{
    flex:1;margin:0 6px;padding:8px 16px;border-left:3px solid var(--ocean-light);
    background:linear-gradient(90deg,rgba(144,224,239,.18),transparent);
    border-radius:0 12px 12px 0;
  }
  .quote .zh{font-size:15px;font-weight:700;color:var(--ocean-deep);}
  .quote .en{font-size:12px;color:var(--ink-soft);margin-top:2px;font-style:italic;}
  .quote .refresh{cursor:pointer;font-size:11px;color:var(--ocean);margin-left:8px;text-decoration:underline;}

  /* 手机端金句栏（刘海下方） */
  .mob-quote{
    display:none;
    margin:0 0 10px;padding:12px 16px;
    padding-top:calc(12px + env(safe-area-inset-top));
    border-left:3px solid var(--ocean-light);
    background:linear-gradient(90deg,rgba(144,224,239,.22),rgba(255,255,255,.6));
    border-radius:0 14px 14px 0;
    box-shadow:var(--shadow-sm);
  }
  .mob-quote .zh{font-size:15px;font-weight:700;color:var(--ocean-deep);line-height:1.4;}
  .mob-quote .en{font-size:12px;color:var(--ink-soft);margin-top:3px;font-style:italic;line-height:1.3;}
  .mob-quote .refresh{cursor:pointer;font-size:11px;color:var(--ocean);margin-left:8px;text-decoration:underline;}

  /* 首页内嵌头部（金句+时间+天气，紧挨标题下方） */
  /* 手机端时间栏（仅窄屏可见，含实时时间 / 公历 / 农历 / 周几 / 天气） */
  .content{flex:1;overflow-y:auto;padding:24px 26px 40px;}
  .view-title{font-size:20px;font-weight:800;color:var(--ocean-deep);margin-bottom:4px;display:flex;align-items:center;gap:10px;}
  .view-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:18px;}

  /* Home grid */
  .progress-ring-wrap{display:flex;align-items:center;gap:18px;background:var(--card);border-radius:18px;padding:18px 22px;box-shadow:var(--shadow);margin-bottom:22px;}
  .ring{position:relative;width:96px;height:96px;flex:0 0 96px;}
  .ring svg{transform:rotate(-90deg);}
  .ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:800;color:var(--ocean-deep);}
  .ring .num b{font-size:24px;}
  .ring .num span{font-size:11px;color:var(--ink-soft);}
  .progress-meta{flex:1;}
  .progress-meta h3{font-size:16px;color:var(--ocean-deep);margin-bottom:4px;}
  .progress-meta p{font-size:12.5px;color:var(--ink-soft);}
  .ghost-btn{margin-left:auto;background:rgba(27,108,168,.1);border:1px solid var(--ocean-light);color:var(--ocean);padding:8px 14px;border-radius:10px;font-size:12.5px;cursor:pointer;transition:.15s;white-space:nowrap;}
  .ghost-btn:hover{background:var(--ocean);color:#fff;}

  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  .mini-card{
    background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow-sm);
    display:flex;gap:12px;align-items:center;cursor:pointer;transition:.18s;border:2px solid transparent;
  }
  .mini-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--sky);}
  .mini-card .av{width:46px;height:46px;flex:0 0 46px;border-radius:50%;overflow:hidden;}
  .mini-card .av svg{width:100%;height:100%;display:block;}
  .mini-card .info{flex:1;min-width:0;}
  .mini-card .info .nm{font-size:14px;font-weight:700;color:var(--ocean-deep);}
  .mini-card .info .st{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .mini-check{
    width:30px;height:30px;flex:0 0 30px;border-radius:50%;border:2px solid var(--ocean-light);
    display:flex;align-items:center;justify-content:center;color:var(--ocean-light);font-size:16px;transition:.15s;background:var(--card-bg);
  }
  .mini-card.done .mini-check{background:var(--ocean);border-color:var(--ocean);color:#fff;}
  .mini-card.done{background:rgba(255,255,255,.75);border-color:var(--ocean-light);box-shadow:0 2px 10px rgba(72,202,228,.3);}

  /* ===== 新版首页：大头像 + 问候 + 快捷入口 + 金句 ===== */
  .home-hero{text-align:center;padding:12px 0 6px;}
  .home-avatar-wrap{width:120px;height:120px;margin:0 auto 10px;border-radius:50%;}
  .home-avatar{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;box-shadow:var(--shadow);}
  .home-greet{text-align:center;margin:0 14px 12px;color:var(--ocean-deep);font-weight:600;line-height:1.45;}
  .home-greet .greet-hi{font-size:19px;font-weight:800;margin-bottom:4px;}
  .home-greet .greet-sub{font-size:13.5px;color:var(--ink-soft);display:block;margin:3px 0 2px;}
  .home-greet .greet-en{font-size:10.5px;color:#5a7d95;display:block;margin-top:2px;}
  .home-ov-title{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:800;color:var(--ocean-deep);}
  .home-ov-icon{width:22px;height:22px;border-radius:4px;object-fit:contain;}

  /* Module detail */
  .detail-head{display:flex;align-items:center;gap:16px;margin-bottom:20px;}
  .detail-head .bigav{width:64px;height:64px;border-radius:50%;overflow:hidden;box-shadow:var(--shadow-sm);background:var(--card-bg);}
  .detail-head .bigav svg{width:100%;height:100%;display:block;}
  .detail-head h2{font-size:23.5px;color:var(--ocean-deep);}
  .detail-head p{font-size:14.0px;color:var(--ink-soft);margin-top:3px;}

  .panel-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
  .panel{background:var(--card);border-radius:16px;padding:18px;box-shadow:var(--shadow-sm);flex:1;min-width:240px;}
  .panel h4{font-size:14.5px;color:var(--ink-soft);margin-bottom:10px;font-weight:700;letter-spacing:.5px;}
  .big-num{font-size:39.5px;font-weight:800;color:var(--ocean);line-height:1;}
  .big-num small{font-size:15.5px;color:var(--ink-soft);font-weight:600;margin-left:4px;}
  .streak{font-size:14.5px;color:var(--ocean-deep);margin-top:8px;}

  .checkin-btn{
    display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--ocean),var(--ocean-light));
    color:#fff;border:none;padding:11px 20px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;
    box-shadow:0 6px 14px rgba(27,108,168,.3);
  }
  .checkin-btn:hover{transform:translateY(-2px);}
  .checkin-btn.done{background:linear-gradient(135deg,#57cc99,#80ed99);box-shadow:0 6px 14px rgba(87,204,153,.3);}

  .log-row{display:flex;gap:10px;margin-top:6px;align-items:center;}
  .log-row input{
    flex:1;padding:10px 12px;border:1.5px solid var(--sky);border-radius:10px;font-size:14px;outline:none;color:var(--ink);
    background:#f7fcff;
  }
  .log-row input:focus{border-color:var(--ocean-light);}
  .log-row .add{background:var(--ocean);color:#fff;border:none;padding:10px 16px;border-radius:10px;font-size:15.0px;cursor:pointer;font-weight:700;}

  .mode-toggle{display:inline-flex;background:var(--foam);border-radius:10px;padding:3px;margin-top:4px;}
  .mode-toggle button{border:none;background:transparent;padding:7px 14px;border-radius:8px;font-size:14.0px;cursor:pointer;color:var(--ink-soft);font-weight:700;}
  .mode-toggle button.on{background:#fff;color:var(--ocean);box-shadow:var(--shadow-sm);}

  .history{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:10px;}
  .hbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .hbar .bar{width:70%;background:linear-gradient(180deg,var(--ocean-light),var(--ocean));border-radius:6px 6px 0 0;min-height:3px;transition:.3s;}
  .hbar .day{font-size:11.5px;color:var(--ink-soft);margin-top:5px;}
  .hbar .val{font-size:11.5px;color:var(--ocean-deep);font-weight:700;margin-bottom:2px;}
  .empty-hint{font-size:13.5px;color:var(--ink-soft);padding:20px 0;text-align:center;}

  .reset-today{background:rgba(239,131,84,.12);border:1px solid #ef8354;color:#d9540d;padding:8px 14px;border-radius:10px;font-size:14.0px;cursor:pointer;transition:.15s;margin-top:4px;}
  .reset-today:hover{background:#ef8354;color:#fff;}

  .saved-tip{position:fixed;bottom:18px;right:18px;background:var(--ocean-deep);color:#fff;padding:9px 16px;border-radius:12px;font-size:12.5px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none;z-index:50;}
  .saved-tip.show{opacity:1;transform:translateY(0);}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:rgba(27,108,168,.3);border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ===== 中英对照：英文小一号、柔和 ===== */
  .en-sm{font-size:.74em;font-weight:400;opacity:.6;margin-left:5px;letter-spacing:.2px;white-space:nowrap;font-style:normal;}

  /* ===== 今日内容面板 ===== */
  .content-today{margin-top:18px;border:1px solid rgba(72,202,228,.5);background:linear-gradient(180deg,#f4fbff,#eef8ff);}
  .ct-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .ct-head h4{font-size:16.5px;color:var(--ocean-deep);}
  .ct-badge{font-size:12.5px;color:var(--ocean);background:rgba(72,202,228,.16);padding:3px 10px;border-radius:20px;white-space:nowrap;}
  .ct-title{font-size:17.5px;font-weight:800;color:var(--ocean-deep);margin:2px 0 4px;padding-left:10px;border-left:3px solid var(--gold);}
  .ct-loc{font-size:13.5px;font-weight:700;color:#5a7d95;margin:0 0 12px 13px;letter-spacing:.3px;}
  .ct-block{background:var(--card-bg);border-radius:12px;padding:11px 14px;margin-bottom:9px;box-shadow:var(--shadow-sm);}
  .ct-h{font-size:14.5px;font-weight:700;color:var(--ocean);margin-bottom:5px;}
  .ct-body{font-size:14.5px;line-height:1.7;color:#2b4a63;}
  /* 徒步路线图片画廊 */
  .rg-block{border-left:3px solid var(--gold);}
  .route-gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px;}
  .rg-item{margin:0;position:relative;border-radius:10px;overflow:hidden;background:#e9f1f6;aspect-ratio:16/9;box-shadow:var(--shadow-sm);}
  .rg-item img{width:100%;height:100%;object-fit:cover;display:block;}
  .rg-item figcaption{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:12.5px;padding:2px 7px;border-radius:8px;}
  @media(min-width:721px){ .route-gallery{grid-template-columns:repeat(3,1fr);} }
  .ct-body img.face{display:block;width:148px;height:148px;object-fit:cover;border-radius:14px;margin:2px auto 8px;background:#eef3f7;box-shadow:0 4px 14px rgba(20,40,60,.14);}
  .ct-body .tags{font-weight:700;color:#1f6f8b;letter-spacing:.3px;}
  .ct-body p{margin:0 0 7px;}
  /* 企业看点里的「名人故事」按钮 + 弹窗 */
  .fam-btn{display:inline-block;margin-left:8px;padding:3px 11px;border:none;border-radius:14px;background:linear-gradient(135deg,#ff8a3d,#ff5e62);color:#fff;font-size:13.5px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(255,94,98,.28);vertical-align:middle;}
  .fam-btn:hover{filter:brightness(1.05);}
  .fam-overlay{position:fixed;inset:0;background:rgba(10,25,40,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:18px;}
  .fam-modal{background:var(--card-bg);border-radius:16px;max-width:440px;width:100%;max-height:86vh;overflow:auto;padding:18px 18px 22px;position:relative;box-shadow:0 18px 50px rgba(0,0,0,.3);}
  .fam-modal .fam-top{font-size:16.5px;font-weight:800;color:#ff5e62;margin-bottom:10px;}
  .fam-close{position:absolute;top:10px;right:12px;border:none;background:#eef3f7;width:30px;height:30px;border-radius:50%;font-size:16.5px;line-height:1;cursor:pointer;color:#456;}
  .fam-close:hover{background:#dde7ee;}
  .fam-modal .ct-block{box-shadow:none;background:#f7fbfd;}
  .ct-body p:last-child{margin-bottom:0;}
  .ct-body ul{margin:0 0 4px;padding-left:20px;}
  .ct-body li{margin:2px 0;}
  .ct-body .ph{background:#f1f8fc;border-left:3px solid var(--ocean-light);padding:9px 12px;border-radius:0 10px 10px 0;font-size:14.0px;line-height:1.75;color:#22455e;}
  .ct-body .ph br{margin-bottom:3px;}
  /* 今日内容的第一个 block 通常是使用提示，缩小作为小提醒/Tips */
  .content-today .ct-block.first{padding:6px 9px;background:rgba(72,202,228,.06);border-left:2px solid var(--ocean-light);margin-bottom:7px;}
  .content-today .ct-block.first .ct-h{font-size:12.0px;font-weight:700;margin-bottom:2px;color:#3a6a85;}
  .content-today .ct-block.first .ct-body{font-size:12.0px;line-height:1.45;color:#5a7a90;}
  .content-today .ct-block.first .ct-body p{margin-bottom:3px;}
  /* 更新时间 / 实时徽章 / 换一批 */
  .ct-sub{font-size:13.0px;color:#5b87a3;margin:-4px 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .ct-refresh{cursor:pointer;color:#fff;background:var(--ocean);padding:2px 10px;border-radius:20px;font-weight:700;user-select:none;transition:.15s;}
  .ct-refresh:hover{background:var(--ocean-deep);}
  .ct-badge.live{background:#ffe3e3;color:#d6336c;border:1px solid #ffc9c9;}

  /* 实时新闻列表 */
  .news-list{display:flex;flex-direction:column;gap:8px;}
  .news-item{display:block;background:var(--card-bg);border:1px solid rgba(72,202,228,.35);border-radius:10px;padding:9px 12px;text-decoration:none;transition:.15s;}
  .news-item:hover{border-color:var(--ocean);box-shadow:var(--shadow-sm);transform:translateX(2px);}
  .news-item .nt{font-size:14.5px;font-weight:700;color:var(--ocean-deep);line-height:1.4;}
  .news-item .nm{font-size:12.5px;color:#7a9bb0;margin-top:3px;}

  /* ===== 英语 听/说/单词 练习 ===== */
  .en-practice{margin-top:14px;display:flex;flex-direction:column;gap:14px;}
  .en-sec{background:var(--card-bg);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-sm);border:1px solid rgba(72,202,228,.25);}
  .en-sec-h{font-size:15.5px;font-weight:800;color:var(--ocean-deep);display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .en-sub{font-size:12.5px;font-weight:500;color:#7a97ab;}
  .mini-btn{margin-left:auto;border:none;background:rgba(72,202,228,.16);color:var(--ocean-deep);font-size:13.5px;padding:5px 12px;border-radius:20px;cursor:pointer;font-weight:700;transition:.15s;}
  .mini-btn:hover{background:rgba(72,202,228,.32);}
  .en-lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;}
  .en-line{display:flex;flex-direction:row;align-items:flex-start;gap:9px;font-size:15.0px;line-height:1.55;padding:7px 9px;border-radius:9px;transition:.15s;}

<script>
/* ============ 基础工具 ============ */
const $ = (s,el=document)=>el.querySelector(s);
const STORE_KEY = 'oceanWorkbench_v1';
/* 中英对照辅助：返回「中文<span class="en-sm">English</span>」 */
function bi(zh, en){ return zh + '<span class="en-sm">' + (en||'') + '</span>'; }

function todayStr(d=new Date()){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function dayDiff(a,b){ // a,b: Date
  return Math.round((a.setHours(0,0,0,0)-b.setHours(0,0,0,0))/86400000);
}
// 基于日历日期的稳定索引：同一天稳定、不同天不同，与"首次使用天数"无关
function dateIndex(id, len){
  const d=new Date();
  const dayKey = d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
  let h = dayKey >>> 0;
  for(let i=0;i<id.length;i++){ h = (Math.imul(h,31) + id.charCodeAt(i)) >>> 0; }
  return h % len;
}
// 判断 ISO 时间戳是否为今天（用于手动刷新只当天有效）
function isTodayISO(iso){
  if(!iso) return false;
  return String(iso).slice(0,10) === todayStr();
}
function load(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; }
}
function save(obj){
  localStorage.setItem(STORE_KEY, JSON.stringify(obj));
  showSaved();
}
let DB = load();
if(!DB.modules) DB.modules = {};
if(!DB.startDate){ DB.startDate = todayStr(); save(DB); }
if(!DB.contentMeta) DB.contentMeta = {};
const LIVE = {};   // 运行时实时内容缓存（不写盘，刷新即重新获取）
function dayNumber(){ // 从首次使用起算的天数（0 = 第1天）
  return Math.max(0, dayDiff(new Date(), new Date(DB.startDate + 'T00:00:00')));
}
function showSaved(){
  const t=$('#savedTip'); t.classList.add('show');
  clearTimeout(showSaved._t);
  showSaved._t=setTimeout(()=>t.classList.remove('show'),1200);
}
function dayOfYear(d){
  const start=new Date(d.getFullYear(),0,0);
  return Math.floor((d-start)/86400000);
}

/* ============ 模块定义（精简 7 项 + 海贼王角色头像） ============ */
const MODULES = [
  {id:'english',  name:'英语学习',     en:'English Learning',     desc:'每日单词·表达', unit:'分钟', img:'assets/garp.webp',  char:'路飞', noCheckin:true},
  {id:'ai',       name:'AI课程',       en:'AI Course',             desc:'一课一练', unit:'课',   img:'assets/sanji.webp', char:'索隆', noCheckin:true},
  {id:'trade',    name:'3C跨境企业',en:'3C Cross-border Enterprises',desc:'企业案例库', unit:'家', img:'assets/zoro.webp', char:'布鲁克', noCheckin:true},
  {id:'overseas', name:'海外企业',     en:'Overseas Companies',    desc:'海外公司图谱', unit:'家',   img:'assets/usopp.webp', char:'山治', noCheckin:true},
  {id:'news',     name:'全球新闻热点', en:'Global News',           desc:'今日要闻', unit:'条',   img:'assets/ace.webp',    char:'娜美',  noCheckin:true},
  {id:'social',   name:'社媒内容',     en:'Social Media',           desc:'选题与素材', unit:'篇',   img:'assets/luffy.webp',   char:'乔巴', noCheckin:true},
  {id:'diet',     name:'旺仔的饮食',   en:"Wangzai's Diet",        desc:'饮食记录', unit:'餐',   img:'assets/chopper.webp', char:'罗宾',  noCheckin:true},
  {id:'overview', name:'今日航海总览', en:"Today's Overview",      unit:'',     img:null,                  char:'🧭', noCheckin:true},
  {id:'travel',   name:'全球徒步路线', en:'World Hiking Routes',   desc:'路线推荐', unit:'route', img:'assets/sabo.webp', char:'甚平',  noCheckin:true},
];
if(!DB.moduleOrder || !DB.moduleOrder.length) DB.moduleOrder = MODULES.map(m=>m.id);
// 兼容升级：保留用户自定义顺序，把新模块按 MODULES 默认顺序追加到末尾，过滤已删除模块
(function syncModuleOrder(){
  const validIds = new Set(MODULES.map(m=>m.id));
  const cur = (DB.moduleOrder||[]).filter(id=>validIds.has(id));
  const missing = MODULES.map(m=>m.id).filter(id=>!cur.includes(id));
  if(missing.length){
    DB.moduleOrder = cur.concat(missing);
    save(DB);
  }
})();
function getMod(id){ return DB.modules[id] || (DB.modules[id]={mode:'daily',logs:{},checkins:{}}); }

/* ============ 中英文文案（全球徒步路线模块） ============ */

const LUNAR_MONTHS=['正','二','三','四','五','六','七','八','九','十','冬','腊'];
const LUNAR_DAYS=['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十',
  '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
  '廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
function _lunarYearDays(y){let s=348;for(let i=0x8000;i>0x8;i>>=1){if((LUNAR_INFO[y-1900]&i)!==0)s++;}return s+_lunarLeapDays(y);}
function _lunarLeapMonth(y){return LUNAR_INFO[y-1900]&0xf;}
function _lunarLeapDays(y){if(_lunarLeapMonth(y))return (LUNAR_INFO[y-1900]&0x10000)?30:29;return 0;}
function _lunarMonthDays(y,m){return (LUNAR_INFO[y-1900]&(0x10000>>m))?30:29;}
function getLunarDate(y,m,d){
  if(y<1900||y>2100)return null;
  const base=new Date(1900,0,31),t=new Date(y,m-1,d);
  let off=Math.round((t-base)/86400000),i,tmp;
  for(i=1900;i<2100&&off>0;i++){tmp=_lunarYearDays(i);off-=tmp;}
  if(off<0){off+=tmp;i--;}
  const leap=_lunarLeapMonth(i);let isLeap=false;
  for(i=1;i<13&&off>0;i++){
    if(leap>0&&i===leap+1&&!isLeap){--i;isLeap=true;tmp=_lunarLeapDays(i+1);}
    else{tmp=_lunarMonthDays(i+1,i);}
    if(isLeap&&i===leap+1)isLeap=false;
    off-=tmp;
  }
  if(off===0&&leap>0&&i===leap+1){if(isLeap)isLeap=false;else{isLeap=true;--i;}}
  if(off<0){off+=tmp;--i;}
  return {year:i,month:i,day:off+1,isLeap};
}
function getLunarString(y,m,d){
  const l=getLunarDate(y,m,d);if(!l)return '';
  return (l.isLeap?'闰':'')+'农历'+LUNAR_MONTHS[l.month-1]+'月'+LUNAR_DAYS[l.day-1];
}

/* ============ 天气获取（Open-Meteo · 无需 key） ============ */
const WX_CITY_KEY='oceanWeather_v1';
const WX_DEFAULT={name:'深圳', lat:22.5429, lon:114.0596};
const WX_FRESH_MS=30*60*1000; // 30 分钟
function _wmoIcon(c){
  if(c===0)return'☀️';if(c<=2)return'🌤️';if(c===3)return'☁️';
  if(c<=48)return'🌫️';if(c<=57)return'🌦️';if(c<=67)return'🌧️';
  if(c<=77)return'🌨️';if(c<=82)return'⛈️';if(c<=99)return'⛈️';return'☁️';
}
function _wmoText(c){
  const m={0:'晴',1:'晴间多云',2:'多云',3:'阴',45:'雾',48:'雾凇',
    51:'小毛毛雨',53:'毛毛雨',55:'大毛毛雨',56:'冻毛毛雨',57:'强冻毛毛雨',
    61:'小雨',63:'中雨',65:'大雨',66:'冻雨',67:'强冻雨',
    71:'小雪',73:'中雪',75:'大雪',77:'雪粒',
    80:'阵雨',81:'强阵雨',82:'强阵雨',85:'阵雪',86:'强阵雪',
    95:'雷阵雨',96:'雷雨夹冰雹',99:'强雷雨'};
  return m[c]||'—';
}
async function fetchWeather(force){
  let cached=null;
  try{cached=JSON.parse(localStorage.getItem(WX_CITY_KEY)||'null');}catch(_){}
  if(!force && cached && Date.now()-cached.ts<WX_FRESH_MS) return cached;
  const c=cached&&cached.city?{name:cached.city.name,lat:cached.city.lat,lon:cached.city.lon}:WX_DEFAULT;
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current_weather=true&windspeed_unit=kmh&timezone=auto`;
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok) throw new Error('http '+r.status);
    const j=await r.json();
    if(!j||!j.current_weather) throw new Error('no data');
    const cw=j.current_weather;
    const data={ts:Date.now(),temp:Math.round(cw.temperature),code:cw.weathercode,wind:Math.round(cw.windspeed),city:c};
    try{localStorage.setItem(WX_CITY_KEY,JSON.stringify(data));}catch(_){}
    return data;
  }catch(e){
    if(cached) {cached.stale=true;return cached;}
    return null;
  }
}
function _setWxDot(state){
  const dot=document.getElementById('mtDot');
  if(!dot)return;
  dot.className='mt-dot '+state;
}
async function renderMobWeather(force){
  const ic=document.getElementById('mtWIcon');
  const cd=document.getElementById('mtWCond');
  const tp=document.getElementById('mtWTemp');
  const cy=document.getElementById('mtWCity');
  const rb=document.getElementById('mtWRefresh');
  if(!ic)return;
  if(rb){rb.classList.add('loading');rb.textContent='刷新中…';}
  const w=await fetchWeather(force);
  if(rb){rb.classList.remove('loading');rb.textContent='刷新 Refresh';}
  if(!w){
    ic.textContent='🌫️';cd.textContent='暂不可用';tp.textContent='';cy.textContent='请检查网络';
    _setWxDot('off');
    return;
  }
  ic.textContent=_wmoIcon(w.code);
  cd.textContent=_wmoText(w.code);
  tp.textContent=w.temp+'°C';
  cy.textContent='· '+w.city.name;
  const age=Date.now()-w.ts;
  if(w.stale||age>WX_FRESH_MS) _setWxDot('stale');
  else _setWxDot('live');
}

/* ============ 渲染：侧边栏 ============ */
let dragId=null;
function moduleOrderList(){
  const validIds = new Set(MODULES.map(m=>m.id));
  const order = (DB.moduleOrder && DB.moduleOrder.length) ? DB.moduleOrder : MODULES.map(m=>m.id);
  // 防御性补齐：新模块追加到末尾、已删模块过滤掉
  const present = order.filter(id=>validIds.has(id));
  const missing = MODULES.map(m=>m.id).filter(id=>!present.includes(id));
  return present.concat(missing).map(id=>MODULES.find(m=>m.id===id)).filter(Boolean);
}
function renderNav(){
  const nav=$('#nav');
  nav.innerHTML = moduleOrderList().map(m=>`
    <div class="nav-item" data-id="${m.id}" draggable="true">
      <span class="drag-h">≡</span>
      <span class="av">${avatarSVG(m,30)}</span>
      <span class="lbl">${m.name}</span>
      <span class="dot" data-dot="${m.id}"></span>
    </div>`).join('');
  nav.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click',()=>openModule(el.dataset.id));
    attachDrag(el);
  });
}
function moveModule(fromId, toId){
  const order=[...(DB.moduleOrder||MODULES.map(m=>m.id))];
  const from=order.indexOf(fromId), to=order.indexOf(toId);
  if(from>-1 && to>-1 && from!==to){
    order.splice(to,0,order.splice(from,1)[0]);
    DB.moduleOrder=order; save(DB); renderNav(); refreshNavDots();
  }
}
function attachDrag(el){
  const id=el.dataset.id;
  el.addEventListener('dragstart',e=>{ dragId=id; el.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain',id);}catch(_){} });
  el.addEventListener('dragend',()=>{ el.classList.remove('dragging'); dragId=null; document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('drag-over')); });
  el.addEventListener('dragover',e=>{ e.preventDefault(); if(dragId && dragId!==id) el.classList.add('drag-over'); });
  el.addEventListener('dragleave',()=>{ el.classList.remove('drag-over'); });
  el.addEventListener('drop',e=>{ e.preventDefault(); el.classList.remove('drag-over'); if(dragId && dragId!==id) moveModule(dragId, id); });
  // 移动端：长按进入排序模式
  let timer=null;
  el.addEventListener('touchstart',()=>{
    timer=setTimeout(()=>{ document.body.classList.add('sorting'); el.classList.add('dragging'); dragId=id; if(navigator.vibrate) navigator.vibrate(30); }, 450);
  },{passive:true});
  el.addEventListener('touchmove',e=>{
    if(timer){ clearTimeout(timer); timer=null; }
    if(document.body.classList.contains('sorting')){
      e.preventDefault();
      const y=e.touches[0].clientY;
      const nav=document.getElementById('nav');
      const draggingEl=nav.querySelector('.nav-item.dragging');
      const items=[...nav.querySelectorAll('.nav-item:not(.dragging)')];
      if(!items.length) return;
      let target=items[items.length-1], best=Infinity;
      items.forEach(it=>{ const r=it.getBoundingClientRect(); const off=y-(r.top+r.height/2); if(off<best){best=off;target=it;} });
      if(target && draggingEl && target!==draggingEl) nav.insertBefore(draggingEl, target);
    }
  },{passive:false});
  const endSort=()=>{
    if(timer){ clearTimeout(timer); timer=null; }
    if(document.body.classList.contains('sorting')){
      document.body.classList.remove('sorting');
      const nav=document.getElementById('nav');
      const order=[...nav.querySelectorAll('.nav-item')].map(x=>x.dataset.id);
      DB.moduleOrder=order; save(DB);
      dragId=null; renderNav(); refreshNavDots();
    }
  };
  el.addEventListener('touchend',endSort);
  el.addEventListener('touchcancel',endSort);
}
function refreshNavDots(){
  const t=todayStr();
  MODULES.forEach(m=>{
    const dot=document.querySelector(`[data-dot="${m.id}"]`);
    const done=!!(getMod(m.id).checkins[t]);
    if(dot) dot.style.background = done ? 'var(--gold)' : 'transparent';
  });
}

let _voices=[];
function _loadVoices(){ if('speechSynthesis' in window) _voices=window.speechSynthesis.getVoices(); }
if('speechSynthesis' in window){ _loadVoices(); window.speechSynthesis.onvoiceschanged=_loadVoices; }
function _pickVoice(lang){
  if(!_voices.length) return null;
  const pre=lang.split('-')[0].toLowerCase();
  return _voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith(pre)) || null;
}
function speakEn(text){
  if(!('speechSynthesis' in window)){ alert('当前浏览器不支持语音播放。'); return; }
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=0.95; u.pitch=1;
  const v=_pickVoice('en-US'); if(v) u.voice=v;
  window.speechSynthesis.speak(u);
}
function speakSeq(list, onDone){
  if(!('speechSynthesis' in window)){ alert('当前浏览器不支持语音播放。'); return; }
  window.speechSynthesis.cancel();
  let i=0;
  const step=()=>{
    if(i>=list.length){ onDone&&onDone(); return; }
    const u=new SpeechSynthesisUtterance(list[i]); u.lang='en-US'; u.rate=0.95;
    const v=_pickVoice('en-US'); if(v) u.voice=v;
    u.onend=()=>{ i++; step(); };
    window.speechSynthesis.speak(u);
  };
  step();
}
function _norm(s){ return (s||'').toLowerCase().replace(/[^a-z0-9\s']/g,'').replace(/\s+/g,' ').trim(); }
function speechScore(target, said){
  const A=_norm(target).split(' ').filter(Boolean);
  const B=_norm(said).split(' ').filter(Boolean);
  if(!A.length) return 0;
  const setB=new Set(B);
  let hit=0; A.forEach(w=>{ if(setB.has(w)) hit++; });
  return Math.max(0, Math.min(100, Math.round(hit/A.length*100)));
}

    if(curEl) curEl.textContent = curIdx + 1;
    if(totalEl) totalEl.textContent = speakArr.length;
    if(res) res.innerHTML='（允许麦克风权限后，点击下方按钮开始跟读）<span class="en-sm">Allow mic access, then tap below to shadow-read</span>';
  }
  if(prevBtn) prevBtn.onclick = ()=>{ curIdx--; updateTarget(); };
  if(nextBtn) nextBtn.onclick = ()=>{ curIdx++; updateTarget(); };
  if(tSpk && tgt) tSpk.onclick=()=>speakEn(speakArr[curIdx]||'');
  if(mic && res && tgt) mic.onclick=()=>startSpeech(mic,res,speakArr[curIdx]||'');
  updateTarget();
  document.querySelectorAll('.en-words .spk').forEach(b=>{
    b.onclick=()=>speakEn(p.words[b.dataset.word].w);
  });
}
function startSpeech(btn, resultEl, target){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ resultEl.innerHTML='⚠️ 当前浏览器不支持语音识别，请改用桌面版 Chrome 或 Edge。<span class="en-sm">Speech recognition unsupported—use desktop Chrome or Edge.</span>'; return; }
  if(!window.isSecureContext){
    resultEl.innerHTML='⚠️ 麦克风需在 <b>localhost 或 https</b> 环境下使用。请用 <b>http://localhost:8080</b> 打开本页。<span class="en-sm">Mic needs localhost or https—open via http://localhost:8080.</span>'; return;
  }
  if(btn.classList.contains('recording')) return;
  const rec=new SR();
  rec.lang='en-US'; rec.interimResults=false; rec.maxAlternatives=1; rec.continuous=false;
  btn.classList.add('recording'); btn.textContent='🎙️ 聆听中…<span class="en-sm">Listening…</span>';
  rec.onresult=(ev)=>{
    const said=ev.results[0][0].transcript;
    const score=speechScore(target, said);
    const stars = score>=85?'⭐⭐⭐':(score>=60?'⭐⭐':'⭐');
    const tip = score>=85?'太棒了，发音很准！':(score>=60?'不错，再练一次更顺！':'再来一次，注意单词和节奏～');
    resultEl.innerHTML = `你说：<b>"${said.replace(/</g,'&lt;')}"</b><br>匹配度 <b>${score}%</b> ${stars}<br><span class="tip">${tip}</span>`;
  };
  rec.onerror=(ev)=>{
    btn.classList.remove('recording'); btn.textContent='🎤 点击开始说<span class="en-sm">Tap to speak</span>';
    resultEl.innerHTML='⚠️ 识别失败：'+(ev.error||'未知错误')+'（请允许麦克风权限，并使用 Chrome/Edge）<span class="en-sm">Recognition failed—allow mic access and use Chrome/Edge</span>';
  };
  rec.onend=()=>{ btn.classList.remove('recording'); btn.textContent='🎤 点击开始说<span class="en-sm">Tap to speak</span>'; };
  try{ rec.start(); }catch(e){ /* 已启动则忽略 */ }
}

function stripHtml(html){
  const d=document.createElement('div'); d.innerHTML=html||'';
  return (d.textContent||'').replace(/\s+/g,' ').trim();
}
function getTodayEntry(id){
  const m=MODULES.find(x=>x.id===id);
  let arr=(typeof CONTENT!=='undefined' && CONTENT[id])?CONTENT[id]:null;
  if(id==='news' && LIVE.news && DB.contentMeta.news && DB.contentMeta.news.live) arr=LIVE.news;
  if(!arr||!arr.length) return null;
  const n=dayNumber();
  const meta=DB.contentMeta[id]||{};
  let idx;
  if(id==='english'){ const cap=Math.min(n,arr.length-1); idx=(typeof meta.pick==='number')?Math.min(meta.pick,cap):cap; }
  else { const base=(id==='news'&&meta.live)?0:(n%arr.length); idx=(typeof meta.pick==='number')?(meta.pick%arr.length):base; }
  return {m, e:arr[idx], idx, total:arr.length};
}
function renderOverview(){
  showMobQuote(false);
  showMobTimebar(false);
  const t=todayStr();
  const checkable=MODULES.filter(m=>!m.noCheckin && m.id!=='overview');
  let done=0; checkable.forEach(m=>{ if(getMod(m.id).checkins[t]) done++; });
  const pct=checkable.length?Math.round(done/checkable.length*100):0;
  const R=42,C=2*Math.PI*R, off=C*(1-pct/100);
  const content=$('#content');
  const list=moduleOrderList().filter(m=>m.id!=='overview');
  content.className = 'content';
  content.innerHTML=`
    <div class="mob-back" id="mobBack"><span class="arrow">‹</span><span>返回主页</span><span class="en-sm">Home</span></div>
    <div class="view-title">⚓ 今日航海总览<span class="en-sm">Today's Overview</span></div>
    <div class="view-sub">${t} · 一页看全今日所有航向，点卡片直达模块<span class="en-sm">All today's picks on one page · tap a card to open</span></div>
    ${checkable.length ? `
    <div class="progress-ring-wrap">
      <div class="ring">
        <svg width="96" height="96">
          <circle cx="48" cy="48" r="${R}" stroke="#caf0f8" stroke-width="9" fill="none"/>
          <circle cx="48" cy="48" r="${R}" stroke="#1b6ca8" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/>
        </svg>
        <div class="num"><b>${done}</b><span>/ ${checkable.length}</span></div>
      </div>
      <div class="progress-meta">
        <h3>今日已打卡 ${done} 项<span class="en-sm">${done} checked today</span></h3>
        <p>完成度 ${pct}% · 可打卡模块 ${checkable.length} 个<span class="en-sm">Completion ${pct}% · ${checkable.length} checkable modules</span></p>
      </div>
      <button class="ghost-btn" id="resetToday">↻ 重置今日打卡<span class="en-sm">Reset today</span></button>
    </div>`:''}
    <div class="ov-list">
      ${list.map(m=>{
        const ent=getTodayEntry(m.id);
        const isDone=m.noCheckin?true:!!getMod(m.id).checkins[t];
        const title=ent?ent.e.title:'—';
        const summary=ent?stripHtml((ent.e.blocks&&ent.e.blocks[0]&&ent.e.blocks[0].body)||'').slice(0,70):'';
        return `<div class="ov-card" data-id="${m.id}">
          <span class="av">${avatarSVG(m,44)}</span>
          <div class="ov-info">
            <div class="ov-nm">${m.name}</div>
            <div class="ov-tt">${title}</div>
            <div class="ov-sum">${summary}</div>
          </div>
          <div class="mini-check" style="${isDone?'background:var(--ocean);border-color:var(--ocean);color:#fff;':''}">${isDone?'✓':'‹'}</div>
        </div>`;
      }).join('')}
    </div>
  `;
  content.querySelectorAll('.ov-card').forEach(el=>el.addEventListener('click',()=>openModule(el.dataset.id)));
  const rb=$('#resetToday');
  if(rb) rb.onclick=()=>{
    if(confirm('确定要清空今天的全部打卡记录吗？历史数据会保留。\nClear all of today’s check-ins? History is kept.')){
      MODULES.forEach(m=>{ if(!m.noCheckin){ delete getMod(m.id).checkins[t]; delete getMod(m.id).logs[t]; } });
      save(DB); renderOverview(); refreshNavDots();
    }
  };
  const mb=document.getElementById('mobBack'); if(mb) mb.onclick=()=>renderHome();
}
function openModule(id){
  showMobQuote(false);
  showMobTimebar(false);
  if(id==='overview'){ renderOverview(); return; }
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.id===id));
  const m=MODULES.find(x=>x.id===id);
  const mod=getMod(id);
  const t=todayStr();
  const isDone=!!mod.checkins[t];
  const streak=calcStreak(id);

  const lb=L(m);
  const content=$('#content');
  content.className = 'content';
  content.innerHTML = `
    <div class="mob-back" id="mobBack"><span class="arrow">‹</span><span>返回主页</span><span class="en-sm">Home</span></div>
    <div class="detail-head">
      <span class="bigav">${avatarSVG(m,64)}</span>
      <div>
        <h2>${m.name}</h2>
        <p>记录单位：<span class="en-sm">Unit:</span> ${m.unit} · 数据本地留存<span class="en-sm">Stored locally</span></p>
      </div>
    </div>
    ${m.noCheckin?'' : `
    <div class="panel-row">
      <div class="panel checkin-panel">
        <h4>今日打卡<span class="en-sm">Check-in</span></h4>
        <button class="checkin-btn ${isDone?'done':''}" id="checkBtn">${isDone?bi(ZH.checkDone,EN.checkDone):bi(ZH.checkTodo,EN.checkTodo)}</button>
        <div class="streak">🔥 ${ZH.streakText}<span class="en-sm">${EN.streakText}</span> <b>${streak}</b> ${ZH.streakUnit}<span class="en-sm">${EN.streakUnit}</span></div>
      </div>
    </div>`}
    ${todayContent(id)}
  `;

  if(!m.noCheckin){
    const cb=$('#checkBtn');
    if(cb) cb.onclick=()=>{ toggleCheckin(id); openModule(id); };
  }
  const rb=$('#ctRefresh');
  if(rb) rb.onclick=async ()=>{
    try {
      rb.style.pointerEvents='none';
      rb.textContent='⏳ 换取中…';
      if(id==='news'){
        rb.textContent='⏳ 正在获取实时新闻…';
        const ok = await fetchNewsLive(id);
        refreshContent(id);
        if(!ok) alert('实时获取失败（可能网络受限），已为你保留精选热点库。\nLive fetch failed (network limited); kept curated hotspots.');
      } else {
        refreshContent(id);
      }
    } catch(err) {
      rb.style.pointerEvents='';
      rb.textContent='🔄 换一批 Refresh';
      alert('刷新失败：'+(err.message||err)+'\n请尝试刷新整个页面。\nRefresh failed: '+(err.message||err));
    }
  };
  // 新闻：每次打开若未实时拉取过，则自动尝试一次
  if(id==='news' && !(DB.contentMeta.news && DB.contentMeta.news.live)){
    fetchNewsLive(id).then(ok=>{ if(ok && $('#ctRefresh')) openModule(id); }).catch(()=>{});
  }
  if(id==='english'){
    const ep = (typeof CONTENT!=='undefined' && CONTENT.english) ? CONTENT.english : null;
    const eIdx = ep ? contentIdx('english', ep) : 0;
    setupEnglishPractice(eIdx);
  }
  const mb=document.getElementById('mobBack'); if(mb) mb.onclick=()=>renderHome();
}
function calcStreak(id){
  const mod=getMod(id);
  let s=0; const d=new Date();
  // 若今天未打卡，从昨天起算
  if(!mod.checkins[todayStr(d)]) d.setDate(d.getDate()-1);
  while(mod.checkins[todayStr(d)]){ s++; d.setDate(d.getDate()-1); }
  return s;
}
function toggleCheckin(id){
  const mod=getMod(id); const t=todayStr();
  if(mod.checkins[t]) delete mod.checkins[t]; else mod.checkins[t]=true;
  save(DB); refreshNavDots();
  if($('#content').querySelector('.card-grid')) renderHome();
}

/* ============ 启动 ============ */
function init(){
  $('#brandLogo').innerHTML=BRAND_SVG;
  renderNav();
  ensureDailyQuote();
  renderHome();
  refreshNavDots();
  tickClock(); setInterval(tickClock,1000);
  // 跨天自动刷新：0点后清除手动刷新标记，回到"日历日稳定内容"，并重渲染当前视图
  let _lastDay = todayStr();
  setInterval(()=>{
    const d = todayStr();
    if(d !== _lastDay){
      _lastDay = d;
      // 清除所有模块的"当天手动刷新"pick，让内容回到新一天的日历种子
      if(DB.contentMeta){
        Object.keys(DB.contentMeta).forEach(k=>{ if(DB.contentMeta[k]) delete DB.contentMeta[k].pick; });
        try{ save(DB); }catch(_){}
      }
      ensureDailyQuote(); refreshNavDots();
      // 若正打开某模块，重渲染以展示新内容
      const open = document.querySelector('.nav-item.active');
      if(open && open.dataset.id) openModule(open.dataset.id);
      else renderHome();
    }
  }, 30000);
  // 离线 / 恢复在线时给个轻提示（仅非桌面）
  window.addEventListener('online', ()=>{ /* 天气模块已移除，此处保留事件占位 */ });
}
init();

/* 注册 Service Worker：在线优先获取最新版，离线时使用缓存 */
if('serviceWorker' in navigator){
  // 新 Service Worker 接管后，仅在在线时刷新一次；离线时不强行 reload
  let _wzReloading = false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(navigator.onLine && !_wzReloading){ _wzReloading = true; location.reload(); }
  });
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js?v=34',{updateViaCache:'none'})
      .then(reg=>reg.update())
      .catch(()=>{});
  });
  // 监听网络状态，恢复在线时尝试拉新
  window.addEventListener('online', () => {
    if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
      navigator.serviceWorker.getRegistration().then(reg => reg && reg.update()).catch(()=>{});
    }
  });
}</script>
